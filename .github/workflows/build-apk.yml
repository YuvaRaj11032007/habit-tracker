name: Build & Release Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build HabitPulse Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sync Web App Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp habit_pulse_dashboard.html android/app/src/main/assets/habit_pulse_dashboard.html

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy & Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HabitPulse.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitPulse-APK
          path: HabitPulse.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 HabitPulse.apk \
            --title "HabitPulse v1.0.0 (Android APK)" \
            --notes "### 📱 HabitPulse Mobile App for Android

          Download the APK directly to your mobile phone:
          - **[Download HabitPulse.apk](https://github.com/YuvaRaj11032007/habit-tracker/releases/download/v1.0.0/HabitPulse.apk)**

          #### 📥 How to Install on Android:
          1. Tap the download link above on your Android phone.
          2. Open the downloaded file from your browser downloads or Files app.
          3. Tap **Install** (allow 'Install unknown apps' if prompted).
          4. Open **HabitPulse** and enjoy tracking your daily habits!" \
            --clobber
